[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sourced"
version = "0.1.0"
description = "Question answering over your docs, with hybrid retrieval and verifiable citations."
readme = "README.md"
license = "MIT"
authors = [{ name = "Yitai Huang" }]
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.13",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "fastembed>=0.9",
    "numpy>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[project.scripts]
sourced = "sourced.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sourced"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["SIM905"]  # a split() word list reads better than a 40-item literal
